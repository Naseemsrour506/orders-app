name: עדכון Supabase

# מעדכן את מסד הנתונים ואת פונקציית ההתראות בכל שינוי ב-main.
# צריך שלושה Secrets במאגר: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD
on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

concurrency: supabase-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: בדיקה שהוגדרו Secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::חסרים Secrets. ראו README, שלב 3"
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: supabase link --project-ref "$PROJECT_REF"
      - run: supabase db push --include-all
      - run: supabase functions deploy notify --project-ref "$PROJECT_REF" --no-verify-jwt
